name: Test

on:
  pull_request:
    branches:
      - main
    # The integration jobs commit these records themselves; such a commit should not start another run
    paths-ignore:
      - '**/.licenses/**'
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Shellcheck
        run: shellcheck jvm/*.sh scripts/*.sh
      - name: Config merge keeps the shared entries
        run: |
          mkdir -p "$RUNNER_TEMP/repository"
          printf 'reviewed:\n  npm:\n    - local-package\nignored:\n  npm:\n    - local-ignored\n' > "$RUNNER_TEMP/repository/.licensed.yml"
          WORKING_DIRECTORY="$RUNNER_TEMP/repository" bash scripts/merge-config.sh "$RUNNER_TEMP/merged.yml"
          yq -e '.reviewed.npm | contains(["openpgp", "local-package"])' "$RUNNER_TEMP/merged.yml"
          yq -e '.ignored.npm | contains(["@openhealthhub/storybook-components", "local-ignored"])' "$RUNNER_TEMP/merged.yml"
          yq -e '.allowed | contains(["mit"])' "$RUNNER_TEMP/merged.yml"

  # The integration jobs commit license records to the pull request branch, so they run one after another
  integration-maven:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./jvm
        with:
          build-tool: 'maven'
          working-directory: test/maven
          paths: '**'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  integration-gradle:
    needs: [test, integration-maven]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./jvm
        with:
          build-tool: 'gradle'
          working-directory: test/gradle
          paths: '**'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  integration-npm:
    needs: [test, integration-gradle]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./npm
        with:
          working-directory: test/npm
          paths: '**'
          github-token: ${{ secrets.GITHUB_TOKEN }}
