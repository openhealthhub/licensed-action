version: 2
updates:
  # "/" covers the workflows in .github/workflows
  - package-ecosystem: github-actions
    directories:
      - /
      - /npm
      - /jvm
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
