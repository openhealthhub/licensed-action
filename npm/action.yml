name: 'Check npm licenses'
description: 'Checks the licenses of runtime npm dependencies from a CycloneDX SBOM and commits a record per dependency'
inputs:
  github-token:
    description: 'The github token to commit license records'
    required: true
  working-directory:
    description: 'The directory containing package.json'
    required: false
    default: '.'
  paths:
    description: 'Glob patterns, one per line, of the files whose change requires a license check on a pull request; defaults to the lockfiles'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
    - name: Check for dependency changes
      id: changes
      shell: bash
      env:
        LICENSE_SOURCE: npm
        PATHS: ${{ inputs.paths }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/../scripts/changes.ts"

    - name: Configure license check
      if: steps.changes.outputs.run == 'true'
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        bash "$GITHUB_ACTION_PATH/../scripts/merge-config.sh" /tmp/.licensed.yml
        yq -o=json /tmp/.licensed.yml > /tmp/.licensed.json
    - name: Check out the branch to commit license records to
      if: steps.changes.outputs.run == 'true'
      shell: bash
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/checkout-branch.sh"

    - name: Install dependencies without running their scripts
      if: steps.changes.outputs.run == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        npm config set ignore-scripts true
        npm ci
    - name: Generate SBOM
      if: steps.changes.outputs.run == 'true'
      id: sbom
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        bom="$RUNNER_TEMP/npm-bom.json"
        npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --ignore-npm-errors \
          --output-format JSON --output-file "$bom" >&2
        echo "bom=$bom" >> "$GITHUB_OUTPUT"
    - name: Cache license records
      if: steps.changes.outputs.run == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BOM: ${{ steps.sbom.outputs.bom }}
      run: node "$GITHUB_ACTION_PATH/../scripts/licenses.ts" cache "$BOM" /tmp/.licensed.json npm .licenses
    - name: Commit license records
      if: steps.changes.outputs.run == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/commit-records.sh"
    - name: Check licenses
      if: steps.changes.outputs.run == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BOM: ${{ steps.sbom.outputs.bom }}
      run: node "$GITHUB_ACTION_PATH/../scripts/licenses.ts" status "$BOM" /tmp/.licensed.json npm
