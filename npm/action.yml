name: 'Check npm licenses'
description: 'Checks the licenses of npm dependencies with licensed and commits a record per dependency'
inputs:
  github-token:
    description: 'The github token to commit license records'
    required: true
  working-directory:
    description: 'The directory containing package.json'
    required: false
    default: '.'
  paths:
    description: 'Glob patterns, one per line, of the files whose change requires a license check on a pull request; defaults to the lockfiles'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
    - name: Check for dependency changes
      id: changes
      shell: bash
      env:
        LICENSE_SOURCE: npm
        PATHS: ${{ inputs.paths }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/../scripts/changes.ts"

    - name: Install dependencies without running their scripts
      if: steps.changes.outputs.run == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        npm config set ignore-scripts true
        npm ci
    - name: Configure licensed
      if: steps.changes.outputs.run == 'true'
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        bash "$GITHUB_ACTION_PATH/../scripts/merge-config.sh" /tmp/.licensed.yml
        yq -i '.source_path = strenv(WORKING_DIRECTORY) | .cache_path = strenv(WORKING_DIRECTORY) + "/.licenses"' /tmp/.licensed.yml

    - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      if: steps.changes.outputs.run == 'true'
      with:
        ruby-version: ruby
        working-directory: ${{ inputs.working-directory }}
    - uses: licensee/setup-licensed@0d52e575b3258417672be0dff2f115d7db8771d8 # v1.3.2
      if: steps.changes.outputs.run == 'true'
      with:
        version: 5.x
    - uses: github/licensed-ci@6e2e80cc71cd0c4b4bf18a9be203443e7e81273a # v1.11.1
      if: steps.changes.outputs.run == 'true'
      with:
        github_token: ${{ inputs.github-token }}
        config_file: /tmp/.licensed.yml
